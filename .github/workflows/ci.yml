name: Build and Lint

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools used by the hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libglib2.0-bin
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci.txt
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Skipped here:
      # - check-pot runs in its own job below.
      # - blueprint-format needs libadwaita newer than ubuntu-latest ships;
      #   the Flatpak job already compiles the .blp files with the real SDK.
      - name: Run pre-commit
        env:
          SKIP: check-pot,blueprint-format
        run: pre-commit run --all-files --show-diff-on-failure

  translation-check:
    name: Check translation template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja
          sudo apt-get update
          sudo apt-get install -y gettext blueprint-compiler desktop-file-utils libglib2.0-dev
      - name: Check if .pot file needs updating
        run: scripts/check-pot.sh

  flatpak:
    name: Flatpak Builder
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-nightly
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: "drum-machine-devel.flatpak"
          manifest-path: "io.github.revisto.drum-machine.json"
          run-tests: "true"
          cache-key: flatpak-builder-${{ github.sha }}
